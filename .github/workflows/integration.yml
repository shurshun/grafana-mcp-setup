name: integration

on:
  workflow_call:

permissions:
  contents: read

jobs:
  oidc:
    name: OIDC and token lifecycle (${{ matrix.api_mode }}, ${{ matrix.auth_mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api_mode:
          - legacy
          - iam
        auth_mode:
          - proxy
          - native
    env:
      GRAFANA_API_MODE: ${{ matrix.api_mode }}
      AUTH_MODE: ${{ matrix.auth_mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build application image
        run: docker build -f Dockerfile.local -t grafana-mcp-setup:integration .

      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: integration
          config: integration/kind.yaml

      - name: Load application image
        run: kind load docker-image grafana-mcp-setup:integration --name integration

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.0.0

      - name: Install Envoy Gateway 1.9.0
        run: |
          helm install envoy-gateway oci://docker.io/envoyproxy/gateway-helm \
            --version v1.9.0 \
            --namespace envoy-gateway-system \
            --create-namespace \
            --wait \
            --timeout 3m

      - name: Start Grafana, Keycloak, Envoy, and application
        run: integration/bootstrap.sh

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: integration/package-lock.json

      - name: Install browser test dependencies
        working-directory: integration
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Run OIDC integration tests
        working-directory: integration
        env:
          README_SCREENSHOT_DIR: readme-screenshots
        run: npm test

      - name: Upload README screenshots
        if: success() && matrix.api_mode == 'legacy' && matrix.auth_mode == 'proxy'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: readme-screenshots
          path: integration/readme-screenshots/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Show Kubernetes state after failure
        if: failure()
        run: |
          kubectl get gateway,httproute,securitypolicy -A -o wide
          kubectl get pods,services -A -o wide
