name: helm

on:
  workflow_call:
  push:
    branches:
      - master
    paths:
      - 'charts/**'
      - '.github/workflows/helm.yml'
  pull_request:
    paths:
      - 'charts/**'
      - '.github/workflows/helm.yml'

concurrency:
  group: chart-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.0.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2

      - name: Lint chart
        # The release tag supplies chart and app versions during packaging.
        run: ct lint --charts charts/grafana-mcp-setup --validate-maintainers=false --check-version-increment=false

      - name: Template chart
        # Every optional path at once, so the Gateway API and Envoy Gateway
        # objects are validated too and not just the always-on defaults.
        # Written inside the workspace, not /tmp: the kubeconform step runs as
        # a docker:// action that only mounts $GITHUB_WORKSPACE.
        run: >-
          helm template test charts/grafana-mcp-setup
          --values charts/grafana-mcp-setup/ci/routed-values.yaml
          --set httpRoute.enabled=true
          --set httpRoute.parentRefs[0].name=envoy-gateway
          --set httpRoute.parentRefs[0].namespace=envoy-gateway-system
          --set httpRoute.hostnames[0]=grafana.example.com
          --set securityPolicy.enabled=true
          --set securityPolicy.clientSecret=ci-not-a-real-secret
          > rendered.yaml

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          cache: false

      - name: Validate rendered manifests
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
          kubeconform \
            -strict \
            -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/ad3b08c5045129d7bb1eeffd8e61719b2c8dd1e2/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered.yaml

      - name: Check API modes
        run: |
          for mode in legacy iam; do
            helm template test charts/grafana-mcp-setup \
              --values charts/grafana-mcp-setup/ci/routed-values.yaml \
              --set grafana.apiMode="$mode" > "rendered-$mode.yaml"
            grep -A1 'name: GRAFANA_API_MODE' "rendered-$mode.yaml" | grep -F "value: \"$mode\""
          done
          grep -A1 'name: GRAFANA_API_MODE' rendered.yaml | grep -F 'value: "legacy"'
          if helm template test charts/grafana-mcp-setup \
            --values charts/grafana-mcp-setup/ci/routed-values.yaml \
            --set grafana.apiMode=auto >/dev/null 2>&1; then
            echo 'unsupported API mode unexpectedly accepted' >&2
            exit 1
          fi

      - name: Check replica and lock invariants
        run: |
          if helm template test charts/grafana-mcp-setup \
            --values charts/grafana-mcp-setup/ci/routed-values.yaml \
            --set-string rotationLock.createLease=false >/dev/null 2>&1; then
            echo 'string createLease unexpectedly accepted' >&2
            exit 1
          fi
          helm template test charts/grafana-mcp-setup \
            --values charts/grafana-mcp-setup/ci/routed-values.yaml \
            --set replicaCount=2 \
            --set rotationLock.mode=kubernetes >/dev/null
          if helm template test charts/grafana-mcp-setup \
            --values charts/grafana-mcp-setup/ci/routed-values.yaml \
            --set replicaCount=2 \
            --set rotationLock.mode=local >/dev/null 2>&1; then
            echo 'local lock unexpectedly accepted replicaCount=2' >&2
            exit 1
          fi
