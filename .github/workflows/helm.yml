name: helm

on:
  push:
    branches:
      - master
    paths:
      - 'charts/**'
      - '.github/workflows/helm.yml'
  pull_request:
    paths:
      - 'charts/**'
      - '.github/workflows/helm.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: helm/chart-testing-action@v2

      - name: Lint chart
        run: ct lint --charts charts/grafana-mcp-setup --validate-maintainers=false

      - name: Template chart
        # Every optional path at once, so the Gateway API and Envoy Gateway
        # objects are validated too and not just the always-on defaults.
        # Written inside the workspace, not /tmp: the kubeconform step runs as
        # a docker:// action that only mounts $GITHUB_WORKSPACE.
        run: >-
          helm template test charts/grafana-mcp-setup
          --values charts/grafana-mcp-setup/ci/routed-values.yaml
          --set httpRoute.enabled=true
          --set httpRoute.parentRefs[0].name=envoy-gateway
          --set httpRoute.parentRefs[0].namespace=envoy-gateway-system
          --set httpRoute.hostnames[0]=grafana.example.com
          --set securityPolicy.enabled=true
          --set securityPolicy.clientSecret=ci-not-a-real-secret
          > rendered.yaml

      - name: Validate rendered manifests
        uses: docker://ghcr.io/yannh/kubeconform:latest
        with:
          args: >-
            -strict -summary
            -schema-location default
            -schema-location https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
            rendered.yaml

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build a local image for the install test
        run: docker build -f Dockerfile.local -t grafana-mcp-setup:ci-test .

      - uses: helm/kind-action@v1
        with:
          cluster_name: chart-testing

      - name: Load the local image into kind
        run: kind load docker-image grafana-mcp-setup:ci-test --name chart-testing

      - uses: azure/setup-helm@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: helm/chart-testing-action@v2

      - name: Serve an OIDC discovery document for the install to find
        # The service resolves its issuer at startup and exits if it cannot, so
        # without this the pod crash-loops and the install below waits for a
        # readiness that can never arrive.
        run: |
          kubectl apply -f charts/grafana-mcp-setup/ci/fake-idp.yaml
          kubectl rollout status deployment/fake-idp --timeout 120s

      - name: Install the chart into kind
        # ct-values.yaml points image.* at the image built and kind-loaded
        # above, so this does not depend on a published release existing.
        run: ct install --charts charts/grafana-mcp-setup --helm-extra-args "--timeout 120s"

      - name: Show what landed
        run: kubectl get all -A -l app.kubernetes.io/name=grafana-mcp-setup
