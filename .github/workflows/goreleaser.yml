name: goreleaser

on:
  push:
    branches:
      - master
    tags:
      - v*
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    uses: ./.github/workflows/integration.yml # zizmor: ignore[self-repository] -- actionlint requires documented relative workflow calls.

  chart:
    uses: ./.github/workflows/helm.yml # zizmor: ignore[self-repository] -- actionlint requires documented relative workflow calls.

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          cache: false
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.2
          install-mode: goinstall
          skip-cache: true

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          cache: false
      - run: go mod tidy -diff
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - lint
      - test
      - integration
      - chart
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          cache: false

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.51.1
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.0.0

      - name: Verify release versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=${TAG#v}
          CHART_METADATA=$(helm show chart charts/grafana-mcp-setup)
          CHART_VERSION=$(awk '$1 == "version:" {gsub(/"/, "", $2); print $2}' <<< "$CHART_METADATA")
          APP_VERSION=$(awk '$1 == "appVersion:" {gsub(/"/, "", $2); print $2}' <<< "$CHART_METADATA")
          test "$CHART_VERSION" = "$VERSION"
          test "$APP_VERSION" = "$VERSION"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate and attest image SBOMs
        env:
          TAG: ${{ github.ref_name }}
          REGISTRY_OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          go install github.com/google/go-containerregistry/cmd/crane@v0.20.6
          VERSION=${TAG#v}
          mkdir -p dist-sbom
          for ARCH in amd64 arm64; do
            IMAGE="ghcr.io/$REGISTRY_OWNER/grafana-mcp-setup"
            DIGEST=$(crane digest "$IMAGE:$VERSION-$ARCH")
            SBOM="dist-sbom/grafana-mcp-setup-$VERSION-$ARCH.spdx.json"
            syft "registry:$IMAGE@$DIGEST" -o "spdx-json=$SBOM"
            cosign attest --yes --type spdxjson --predicate "$SBOM" "$IMAGE@$DIGEST"
          done
          gh release upload "$TAG" dist-sbom/*.spdx.json --clobber

      - name: Package, push, sign, and attest Helm chart
        env:
          TAG: ${{ github.ref_name }}
          REGISTRY_OWNER: ${{ github.repository_owner }}
          REGISTRY_USER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${TAG#v}
          CHART_REF="ghcr.io/$REGISTRY_OWNER/charts/grafana-mcp-setup"
          printf '%s' "$GITHUB_TOKEN" | helm registry login ghcr.io -u "$REGISTRY_USER" --password-stdin
          helm package charts/grafana-mcp-setup --version "$VERSION" --app-version "$VERSION" --destination dist-chart
          helm push "dist-chart/grafana-mcp-setup-$VERSION.tgz" "oci://ghcr.io/$REGISTRY_OWNER/charts"

          DIGEST=$(crane digest "$CHART_REF:$VERSION")
          cosign sign --yes "$CHART_REF@$DIGEST"

          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg ref "$GITHUB_REF" \
            --arg sha "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg build_type "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/.github/workflows/goreleaser.yml" \
            --arg builder "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/goreleaser.yml" \
            '{
              buildDefinition: {
                buildType: $build_type,
                externalParameters: {repository: $repository, ref: $ref},
                internalParameters: {},
                resolvedDependencies: [{uri: ("git+https://github.com/" + $repository), digest: {gitCommit: $sha}}]
              },
              runDetails: {
                builder: {id: $builder},
                metadata: {invocationId: ("https://github.com/" + $repository + "/actions/runs/" + $run_id)}
              }
            }' > chart-provenance.json
          cosign attest --yes --type slsaprovenance1 \
            --predicate chart-provenance.json \
            "$CHART_REF@$DIGEST"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist-chart/*.tgz
