apiVersion: v1
kind: Service
metadata:
  name: {{ include "grafana-mcp-setup.fullname" . }}
  labels:
    {{- include "grafana-mcp-setup.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "grafana-mcp-setup.selectorLabels" . | nindent 4 }}
