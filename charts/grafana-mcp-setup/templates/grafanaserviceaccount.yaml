{{- if .Values.grafana.serviceAccountToken.create }}
{{- if empty .Values.grafana.serviceAccountToken.instanceName }}
{{- fail "grafana.serviceAccountToken.instanceName is required when grafana.serviceAccountToken.create is true" }}
{{- end }}
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaServiceAccount
metadata:
  name: {{ include "grafana-mcp-setup.serviceAccountTokenName" . }}
  labels:
    {{- include "grafana-mcp-setup.labels" . | nindent 4 }}
spec:
  instanceName: {{ .Values.grafana.serviceAccountToken.instanceName | quote }}
  name: {{ include "grafana-mcp-setup.serviceAccountTokenName" . | quote }}
  role: Admin
  tokens:
    - name: {{ .Values.grafana.serviceAccountToken.tokenName | quote }}
      secretName: {{ include "grafana-mcp-setup.serviceAccountTokenSecretName" . | quote }}
{{- end }}
