{{- if and .Values.grafana.existingSecret .Values.grafana.adminToken }}
{{- fail "use grafana.existingSecret or grafana.adminToken, not both" }}
{{- end }}
{{- if and .Values.flashCookie.existingSecret .Values.flashCookie.key }}
{{- fail "use flashCookie.existingSecret or flashCookie.key, not both" }}
{{- end }}
{{- if and .Values.securityPolicy.existingSecret .Values.securityPolicy.clientSecret }}
{{- fail "use securityPolicy.existingSecret or securityPolicy.clientSecret, not both" }}
{{- end }}
{{- if and (eq .Values.auth.mode "native") .Values.securityPolicy.enabled }}
{{- fail "securityPolicy.enabled cannot be used with auth.mode=native" }}
{{- end }}
{{- if and (not .Values.grafana.serviceAccountToken.create) (not .Values.grafana.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "grafana-mcp-setup.fullname" . }}-grafana
  labels:
    {{- include "grafana-mcp-setup.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.grafana.existingSecretKey }}: {{ required "grafana.adminToken is required unless grafana.existingSecret is set" .Values.grafana.adminToken | quote }}
{{- end }}
{{- if not .Values.flashCookie.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "grafana-mcp-setup.fullname" . }}-flash
  labels:
    {{- include "grafana-mcp-setup.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.flashCookie.existingSecretKey }}: {{ required "flashCookie.key or flashCookie.existingSecret is required" .Values.flashCookie.key | quote }}
{{- end }}
{{- if and .Values.securityPolicy.enabled (not .Values.securityPolicy.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "grafana-mcp-setup.fullname" . }}-oidc
  labels:
    {{- include "grafana-mcp-setup.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.securityPolicy.existingSecretKey }}: {{ required "securityPolicy.clientSecret is required unless securityPolicy.existingSecret is set" .Values.securityPolicy.clientSecret | quote }}
{{- end }}
{{- if and (eq .Values.auth.mode "native") (not .Values.oidc.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "grafana-mcp-setup.nativeClientSecretName" . }}
  labels:
    {{- include "grafana-mcp-setup.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.oidc.existingSecretKey }}: {{ required "oidc.clientSecret is required in native mode unless oidc.existingSecret is set" .Values.oidc.clientSecret | quote }}
{{- end }}
{{- if and (eq .Values.auth.mode "native") (not .Values.auth.session.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "grafana-mcp-setup.sessionSecretName" . }}
  labels:
    {{- include "grafana-mcp-setup.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.session.existingSecretKey }}: {{ required "auth.session.key is required in native mode unless auth.session.existingSecret is set" .Values.auth.session.key | quote }}
{{- end }}
