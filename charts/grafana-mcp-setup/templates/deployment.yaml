{{- if and (empty .Values.oidc.requiredGroups) (not .Values.oidc.allowAllAuthenticatedUsers) }}
{{- fail "set oidc.requiredGroups or explicitly enable oidc.allowAllAuthenticatedUsers" }}
{{- end }}
{{- if and (eq .Values.rotationLock.mode "local") (gt (int .Values.replicaCount) 1) }}
{{- fail "replicaCount > 1 requires rotationLock.mode=kubernetes" }}
{{- end }}
{{- if and (eq .Values.auth.mode "native") .Values.securityPolicy.enabled }}
{{- fail "securityPolicy.enabled cannot be used with auth.mode=native" }}
{{- end }}
{{- if and (eq .Values.auth.mode "native") (not (hasPrefix "https://" .Values.appPublicURL)) }}
{{- fail "appPublicURL must use https with auth.mode=native" }}
{{- end }}
{{- if and .Values.grafana.serviceAccountToken.create (or .Values.grafana.adminToken .Values.grafana.existingSecret) }}
{{- fail "grafana.serviceAccountToken.create cannot be combined with grafana.adminToken or grafana.existingSecret" }}
{{- end }}
{{- if and (eq .Values.auth.mode "native") .Values.oidc.existingSecret .Values.oidc.clientSecret }}
{{- fail "use oidc.existingSecret or oidc.clientSecret, not both in native mode" }}
{{- end }}
{{- if and (eq .Values.auth.mode "native") .Values.auth.session.existingSecret .Values.auth.session.key }}
{{- fail "use auth.session.existingSecret or auth.session.key, not both in native mode" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "grafana-mcp-setup.fullname" . }}
  labels:
    {{- include "grafana-mcp-setup.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      {{- if eq .Values.rotationLock.mode "local" }}
      maxSurge: 0
      maxUnavailable: 1
      {{- else }}
      maxSurge: 1
      maxUnavailable: 0
      {{- end }}
  selector:
    matchLabels:
      {{- include "grafana-mcp-setup.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "grafana-mcp-setup.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/secrets: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "grafana-mcp-setup.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: BASE_PATH
              value: {{ include "grafana-mcp-setup.basePath" . | quote }}
            - name: GRAFANA_URL
              value: {{ .Values.grafana.url | quote }}
            - name: GRAFANA_API_MODE
              value: {{ .Values.grafana.apiMode | quote }}
            - name: GRAFANA_NAMESPACE
              value: {{ .Values.grafana.namespace | quote }}
            - name: GRAFANA_PUBLIC_URL
              value: {{ .Values.grafana.publicURL | quote }}
            - name: APP_PUBLIC_URL
              value: {{ .Values.appPublicURL | quote }}
            - name: AUTH_MODE
              value: {{ .Values.auth.mode | quote }}
            - name: FLASH_COOKIE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-flash" (include "grafana-mcp-setup.fullname" .)) .Values.flashCookie.existingSecret }}
                  key: {{ .Values.flashCookie.existingSecretKey }}
            - name: OIDC_ISSUER
              value: {{ .Values.oidc.issuer | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientID | quote }}
            - name: REQUIRED_GROUPS
              value: {{ join "," .Values.oidc.requiredGroups | quote }}
            - name: ALLOW_ALL_AUTHENTICATED_USERS
              value: {{ .Values.oidc.allowAllAuthenticatedUsers | quote }}
            - name: ENABLE_ENV_SETUP
              value: {{ .Values.enableEnvSetup | quote }}
            - name: ID_TOKEN_HEADER
              value: {{ .Values.oidc.idTokenHeader | quote }}
            - name: ID_TOKEN_SOURCE
              value: {{ .Values.oidc.idTokenSource | quote }}
            - name: ID_TOKEN_COOKIE
              value: {{ .Values.oidc.idTokenCookie | quote }}
            {{- if eq .Values.auth.mode "native" }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "grafana-mcp-setup.nativeClientSecretName" . }}
                  key: {{ .Values.oidc.existingSecretKey }}
            - name: OIDC_SCOPES
              value: {{ join " " .Values.oidc.scopes | quote }}
            - name: SESSION_COOKIE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "grafana-mcp-setup.sessionSecretName" . }}
                  key: {{ .Values.auth.session.existingSecretKey }}
            - name: SESSION_TTL_SECONDS
              value: {{ .Values.auth.session.ttlSeconds | quote }}
            {{- end }}
            - name: TOKEN_TTL_DAYS
              value: {{ .Values.tokenTTLDays | quote }}
            - name: GRAFANA_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "grafana-mcp-setup.adminTokenSecret" . }}
                  key: {{ include "grafana-mcp-setup.adminTokenSecretKey" . }}
            - name: ROTATION_LOCK_MODE
              value: {{ .Values.rotationLock.mode | quote }}
            {{- if eq .Values.rotationLock.mode "kubernetes" }}
            - name: ROTATION_LEASE_NAME
              value: {{ .Values.rotationLock.leaseName | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: rotation-lock
              mountPath: /var/run/secrets/rotation-lock
              readOnly: true
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if eq .Values.rotationLock.mode "kubernetes" }}
      volumes:
        - name: rotation-lock
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
