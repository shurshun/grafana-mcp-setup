{{- if .Values.networkPolicy.enabled }}
{{- if or (empty .Values.networkPolicy.ingressFrom) (empty .Values.networkPolicy.egress) }}
{{- fail "networkPolicy.enabled requires explicit ingressFrom and egress rules" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "grafana-mcp-setup.fullname" . }}
spec:
  podSelector:
    matchLabels:
      {{- include "grafana-mcp-setup.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - port: http
          protocol: TCP
  egress:
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
{{- end }}
