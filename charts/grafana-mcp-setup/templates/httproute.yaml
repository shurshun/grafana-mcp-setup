{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "grafana-mcp-setup.fullname" . }}
  labels:
    {{- include "grafana-mcp-setup.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml (required "httpRoute.parentRefs is required when httpRoute is enabled" .Values.httpRoute.parentRefs) | nindent 4 }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ include "grafana-mcp-setup.basePath" . }}
      backendRefs:
        - name: {{ include "grafana-mcp-setup.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
