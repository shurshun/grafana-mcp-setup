image:
  repository: ghcr.io/shurshun/grafana-mcp-setup
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# One, and not by accident: a freshly issued token waits in the process's
# memory for the redirect that shows it. A second pod would answer that
# redirect with "already shown".
replicaCount: 1

# Where the service is mounted. The proxy in front of it authenticates this
# prefix and nothing else, so Grafana's own routes are untouched.
basePath: /setup-mcp

grafana:
  # Reached from inside the cluster.
  url: http://grafana.monitoring.svc
  # Goes into the .mcp.json the page hands out.
  publicURL: https://grafana.example.com
  # This service's own token. Admin, because creating a service account needs
  # it and Grafana OSS has no role between Admin and Viewer. Either set it here
  # and let the chart make a Secret, or point existingSecret at your own.
  adminToken: ""
  existingSecret: ""
  existingSecretKey: admin-token

oidc:
  issuer: https://idp.example.com
  clientID: grafana-mcp-setup
  # Membership of this group is the authorisation. Leave it empty only when
  # everyone who can sign in may hold a Grafana token — signing in proves
  # nothing on its own.
  requiredGroup: ""
  # Must match the cookie the proxy leaves the ID token in.
  idTokenCookie: mcp_id_token

tokenTTLDays: 90

service:
  type: ClusterIP
  port: 8080

# A plain Ingress. Authentication is not this chart's job: put an
# authenticating proxy in front, or use the Gateway API route below with an
# Envoy Gateway SecurityPolicy.
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: grafana.example.com
  pathType: Prefix
  tls: []

# Gateway API route, for a gateway that already terminates TLS for the Grafana
# hostname. The longer prefix wins over Grafana's own "/" rule, so declaration
# order does not matter.
httpRoute:
  enabled: false
  parentRefs: []
  #  - name: envoy-gateway
  #    namespace: envoy-gateway-system
  #    sectionName: http
  hostnames: []

# Envoy Gateway's OIDC filter, attached to the route above so that only this
# path asks for a login. Requesting the groups scope is not optional when
# oidc.requiredGroup is set: without it the provider omits the claim and every
# request looks like a permissions failure.
securityPolicy:
  enabled: false
  clientSecret: ""
  existingSecret: ""
  existingSecretKey: client-secret
  scopes:
    - openid
    - profile
    - email
    - groups
  # Lax, not Strict: the identity provider redirects back to this path from its
  # own origin, and a Strict cookie is withheld on that first cross-site hop,
  # which shows up as a CSRF validation failure rather than a cookie problem.
  cookieSameSite: Lax

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}
