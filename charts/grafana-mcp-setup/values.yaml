image:
  repository: ghcr.io/shurshun/grafana-mcp-setup
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Use the Kubernetes lock when pods can overlap, including during a rollout.
replicaCount: 1
rotationLock:
  mode: kubernetes
  # All deployments sharing the same Grafana organization must share this Lease.
  leaseName: grafana-mcp-rotation
  # Retain existing Helm-owned Leases on upgrade. Set false for Argo CD;
  # the application creates a missing Lease itself.
  createLease: true

appPublicURL: https://grafana.example.com
flashCookie:
  existingSecret: ""
  existingSecretKey: flash-cookie-key
  # Supply a persistent base64-encoded random 32-byte key.
  key: ""

# proxy keeps the existing Envoy or external-proxy authentication contract.
# native runs the OIDC authorization-code flow in this application and works
# behind an ordinary Ingress or HTTPRoute.
auth:
  mode: proxy
  session:
    existingSecret: ""
    existingSecretKey: session-cookie-key
    # Supply a persistent base64-encoded random 32-byte key for native mode.
    key: ""
    ttlSeconds: 3600

# Where the service is mounted. Authentication covers this prefix and leaves
# Grafana's own routes untouched. Proxy mode delegates it to the front proxy;
# native mode handles the OIDC flow in this application.
basePath: /setup-mcp

grafana:
  # legacy needs no experimental Grafana flags; iam selects the new API.
  apiMode: legacy
  # Namespace applies only to iam mode.
  namespace: default
  # Reached from inside the cluster.
  url: http://grafana.monitoring.svc
  # Goes into the .mcp.json the page hands out.
  publicURL: https://grafana.example.com
  # The chart creates a Secret from adminToken; existingSecret is optional.
  adminToken: ""
  existingSecret: ""
  existingSecretKey: admin-token
  # This creates a GrafanaServiceAccount through an already-installed Grafana
  # Operator. It does not install the operator or its CRD.
  serviceAccountToken:
    create: false
    # GrafanaServiceAccount and its Grafana instance must share this namespace
    # with the Helm release. The operator token Secret contains key `token`.
    instanceName: ""
    name: ""
    tokenName: issuer
    secretName: ""

oidc:
  issuer: https://idp.example.com
  clientID: grafana-mcp-setup
  # Native mode uses these values for its client registration. Proxy mode uses
  # securityPolicy.clientSecret and securityPolicy.scopes instead.
  clientSecret: ""
  existingSecret: ""
  existingSecretKey: client-secret
  scopes:
    - openid
    - profile
    - email
    - groups
  # Membership of any of these groups is the authorisation. Several, because an
  # application's roles are usually separate groups rather than nested ones.
  #
  # An empty list requires allowAllAuthenticatedUsers to be explicitly true.
  # Proxy and native modes both authorize against the identity provider, not
  # Grafana, so Grafana's own group rules do not apply here.
  requiredGroups: []
  allowAllAuthenticatedUsers: false
  idTokenSource: header
  idTokenHeader: X-Grafana-MCP-ID-Token
  # Used only when idTokenSource is cookie.
  idTokenCookie: mcp_id_token

tokenTTLDays: 90

# Experimental client setup through direnv. Tokens still enter the MCP process environment.
enableEnvSetup: false

service:
  type: ClusterIP
  port: 8080

# A plain Ingress. Proxy mode expects an authenticating proxy in front. Native
# mode performs OIDC in this application and works with the same route.
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: grafana.example.com
  pathType: Prefix
  tls: []

# Gateway API route, for a gateway that already terminates TLS for the Grafana
# hostname. The longer prefix wins over Grafana's own "/" rule, so declaration
# order does not matter.
httpRoute:
  enabled: false
  parentRefs: []
  #  - name: envoy-gateway
  #    namespace: envoy-gateway-system
  #    sectionName: http
  hostnames: []

# Envoy Gateway's OIDC filter, attached to the route above so that only this
# path asks for a login in proxy mode. Native mode forbids this policy.
# Requesting the groups scope is not optional when oidc.requiredGroups is set:
# without it the provider omits the claim and every request looks like a
# permissions failure.
securityPolicy:
  enabled: false
  clientSecret: ""
  existingSecret: ""
  existingSecretKey: client-secret
  scopes:
    - openid
    - profile
    - email
    - groups
  # Lax, not Strict: the identity provider redirects back to this path from its
  # own origin, and a Strict cookie is withheld on that first cross-site hop,
  # which shows up as a CSRF validation failure rather than a cookie problem.
  cookieSameSite: Lax

serviceMonitor:
  enabled: false
  labels: {}
  interval: 30s

# When enabled, configure both ingress peers and destination-specific egress.
networkPolicy:
  enabled: false
  ingressFrom: []
  egress: []

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  # Spelled out because the image's USER is the name "nonroot": kubelet cannot
  # check a non-numeric user against runAsNonRoot and refuses to start the
  # container. 65532 is that user in the distroless base.
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}
