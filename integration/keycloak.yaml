apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  namespace: integration
data:
  integration-realm.json: |
    {
      "realm": "integration",
      "enabled": true,
      "sslRequired": "none",
      "registrationAllowed": false,
      "groups": [
        {"name": "grafana-mcp"}
      ],
      "users": [
        {
          "username": "allowed",
          "email": "allowed@example.com",
          "firstName": "Allowed",
          "lastName": "User",
          "emailVerified": true,
          "enabled": true,
          "credentials": [
            {"type": "password", "value": "allowed-password", "temporary": false}
          ],
          "groups": ["/grafana-mcp"]
        },
        {
          "username": "denied",
          "email": "denied@example.com",
          "firstName": "Denied",
          "lastName": "User",
          "emailVerified": true,
          "enabled": true,
          "credentials": [
            {"type": "password", "value": "denied-password", "temporary": false}
          ]
        }
      ],
      "clientScopes": [
        {
          "name": "groups",
          "protocol": "openid-connect",
          "attributes": {
            "display.on.consent.screen": "false",
            "include.in.token.scope": "true"
          },
          "protocolMappers": [
            {
              "name": "groups",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-group-membership-mapper",
              "config": {
                "access.token.claim": "true",
                "claim.name": "groups",
                "full.path": "true",
                "id.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            }
          ]
        }
      ],
      "clients": [
        {
          "clientId": "grafana-mcp-setup",
          "name": "Grafana MCP setup integration test",
          "enabled": true,
          "clientAuthenticatorType": "client-secret",
          "secret": "integration-client-secret",
          "protocol": "openid-connect",
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "publicClient": false,
          "redirectUris": ["https://app.integration/setup-mcp/oauth2/callback"],
          "webOrigins": ["https://app.integration"],
          "defaultClientScopes": ["groups"],
          "protocolMappers": [
            {
              "name": "email",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-property-mapper",
              "config": {
                "access.token.claim": "true",
                "claim.name": "email",
                "id.token.claim": "true",
                "jsonType.label": "String",
                "user.attribute": "email",
                "userinfo.token.claim": "true"
              }
            }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: integration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0.4
          args:
            - start-dev
            - --import-realm
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: integration-admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: integration-admin-password
            - name: KC_HOSTNAME
              value: http://keycloak.integration
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /realms/integration
              port: http
            initialDelaySeconds: 5
            periodSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: integration
spec:
  selector:
    app: keycloak
  ports:
    - name: http
      port: 80
      targetPort: http
