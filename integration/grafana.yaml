apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: integration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:13.2.1
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: integration-admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: integration-admin-password
            - name: GF_AUTH_BASIC_ENABLED
              value: "true"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: integration
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
