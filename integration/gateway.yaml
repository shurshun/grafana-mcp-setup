apiVersion: v1
kind: Namespace
metadata:
  name: integration
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: integration
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: integration
  namespace: integration
spec:
  gatewayClassName: integration
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.integration"
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: app.integration
      tls:
        mode: Terminate
        certificateRefs:
          - name: integration-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: integration
spec:
  parentRefs:
    - name: integration
  hostnames:
    - keycloak.integration
  rules:
    - backendRefs:
        - name: keycloak
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: integration
spec:
  parentRefs:
    - name: integration
  hostnames:
    - grafana.integration
  rules:
    - backendRefs:
        - name: grafana
          port: 3000
